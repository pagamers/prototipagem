<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas – organizador do dia</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#12142b;--mut:#5d6384;--line:#e1e4ee;--pri:#3347c9;--on:#fff;--ring:#b9bed2;--seg:#e3e6f0;--ok:#1f7a4d;--hb:#fde7e0;--hi:#b5300f;--mb:#fdefc6;--md:#7a4e00;--lb:#dff3e7;--lo:#1f7a4d;--bad:#b5300f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121f;--card:#1a1d31;--ink:#eef0fb;--mut:#a0a6c6;--line:#2b2f4a;--pri:#6a7cf0;--on:#0c0e1c;--ring:#4a5075;--seg:#1f2339;--ok:#4cc58a;--hb:#4a2118;--hi:#ff9a7d;--mb:#473510;--md:#f3c76a;--lb:#143a28;--lo:#6fdba5;--bad:#ff9a7d}}
:root[data-theme="dark"]{--bg:#10121f;--card:#1a1d31;--ink:#eef0fb;--mut:#a0a6c6;--line:#2b2f4a;--pri:#6a7cf0;--on:#0c0e1c;--ring:#4a5075;--seg:#1f2339;--ok:#4cc58a;--hb:#4a2118;--hi:#ff9a7d;--mb:#473510;--md:#f3c76a;--lb:#143a28;--lo:#6fdba5;--bad:#ff9a7d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--h:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.top h2{margin:0;font-size:18px;font-weight:600}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.sm{font-size:14px;color:var(--mut);margin:0 0 4px}
h1{margin:0 0 16px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.prog{padding:14px 16px;margin-bottom:16px}
.prog div:first-child{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.prog span{font-weight:400;color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--seg);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s ease}
.item{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.item.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.item:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ring);background:transparent;flex:none;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tx{flex:1;min-width:0}
.tt{font-size:15.5px;font-weight:600;line-height:1.3}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.dn .tt{text-decoration:line-through;color:var(--mut);font-weight:500}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;flex:none}
.alta{background:var(--hb);color:var(--hi)}.media{background:var(--mb);color:var(--md)}.baixa{background:var(--lb);color:var(--lo)}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:11px 4px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;margin:14px 0 8px;text-transform:uppercase}
.foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
.btn.t{border:0;background:none;color:var(--mut);padding:10px}
.btn.d{border:0;background:none;color:var(--bad);padding:10px;font-size:15px}
.btn.s{padding:11px 18px;font-size:15px;flex:none}
.chip{display:inline-flex;margin:0 8px 8px 0;padding:12px 20px;border-radius:99px;border:1px solid var(--ring);background:var(--card);font-weight:600;cursor:pointer;font-size:15px}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
label.l{display:block;font-size:13.5px;font-weight:700;margin:18px 0 8px}
.in{width:100%;padding:15px 14px;border-radius:12px;border:1px solid var(--ring);background:var(--card);font-size:16px}
textarea.in{resize:none;height:84px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
.st{display:inline-block;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;margin-bottom:12px}
.st.pe{background:var(--mb);color:var(--md)}.st.cl{background:var(--lb);color:var(--lo)}
.kv{padding:4px 16px;margin:18px 0}
.kv div{display:flex;justify-content:space-between;padding:14px 0;font-size:14px;color:var(--mut)}
.kv div+div{border-top:1px solid var(--line)}
.kv b{color:var(--ink);font-weight:700}
.obs{font-size:13px;color:var(--mut);margin:0 0 4px}
.obsx{margin:0;font-size:15.5px;line-height:1.45}
.empty{text-align:center;color:var(--mut);padding:44px 12px;font-size:15px;line-height:1.5}
.late{width:100%;text-align:left;background:var(--hb);color:var(--hi);border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:14px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* layout responsivo */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:var(--h)}
#side{display:none}
#main{padding:28px 20px 96px;min-width:0;display:flex;min-height:var(--h)}
.wrap{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column}
#tabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;border-radius:16px 16px 0 0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#tabs button{flex:1;border:0;background:none;padding:11px 2px;font-size:13px;font-weight:600;color:var(--mut);border-radius:10px;cursor:pointer}
#tabs button.on{color:var(--pri);background:var(--seg)}
#panel{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,calc((100vw - 480px)/2)) calc(20px + env(safe-area-inset-bottom,0px))}
#panel.open{transform:none;visibility:visible}
.pin{min-height:100%;display:flex;flex-direction:column}
.brand{font-size:19px;font-weight:700;padding:4px 14px 18px}
.nav{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut);cursor:pointer;text-align:left}
.nav.on{background:var(--seg);color:var(--ink)}
.nav i{font-style:normal;font-size:12px;background:var(--seg);border-radius:99px;padding:2px 9px}.nav.on i{background:var(--card)}
.dsk{display:none}
@media(min-width:900px){
 .app{grid-template-columns:clamp(200px,20vw,240px) minmax(0,1fr)}
 #side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:var(--h);padding:24px 12px;background:var(--card);border-right:1px solid var(--line)}
 #tabs,.mob{display:none}
 .btn.dsk{display:flex}
 #main{padding:32px 32px 40px}
 .wrap{max-width:720px}
 #panel{left:auto;width:420px;box-shadow:-10px 0 40px rgba(20,25,60,.2);padding-left:24px;padding-right:24px}
 #toast{bottom:28px}
}
@media(min-width:1200px){
 .app{grid-template-columns:240px minmax(0,1fr) 400px}
 #panel{position:sticky;inset:auto;top:0;height:var(--h);transform:none;visibility:visible;width:auto;box-shadow:none;border-left:1px solid var(--line);z-index:1;padding:28px 24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app"><nav id="side" aria-label="Menu principal"></nav><main id="main"></main><aside id="panel" aria-label="Detalhe da tarefa"></aside></div>
<nav id="tabs" aria-label="Menu principal"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=new Date(); now.setHours(0,0,0,0);
const off=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return iso(d)};
const T0=off(0),T1=off(1);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const P={alta:'Alta',media:'Média',baixa:'Baixa'};
const fmt=s=>{const a=s.split('-');return +a[2]+' de '+MES[a[1]-1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wide=()=>matchMedia('(min-width:1200px)').matches;
const CK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const PL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const seed=()=>[
 {id:1,title:'Entregar trabalho de Administração',pri:'alta',date:T0,time:'18:00',done:false,notes:'Enviar o PDF pelo portal da faculdade antes do prazo.',created:off(-1)},
 {id:2,title:'Turno na loja',pri:'media',date:T0,time:'14:00',done:false,notes:'',created:off(-3)},
 {id:3,title:'Estudar para a prova de Contabilidade',pri:'media',date:T0,time:'20:30',done:false,notes:'Capítulos 4 e 5.',created:off(-2)},
 {id:4,title:'Ligar para o banco',pri:'baixa',date:T0,time:'',done:true,notes:'',created:off(-2)},
 {id:5,title:'Comprar caderno',pri:'baixa',date:T0,time:'',done:true,notes:'',created:off(-1)},
 {id:6,title:'Seminário de Marketing',pri:'alta',date:T1,time:'',done:false,notes:'',created:off(-4)},
 {id:7,title:'Pagar a mensalidade',pri:'media',date:T1,time:'',done:false,notes:'',created:off(-1)}];
let tasks;
try{tasks=JSON.parse(localStorage.getItem('tarefas-v2'))}catch(e){}
if(!Array.isArray(tasks))tasks=seed();
const save=()=>{try{localStorage.setItem('tarefas-v2',JSON.stringify(tasks))}catch(e){}};
let page='hoje',filter='todas',panel=null,delArm=false;
const find=id=>tasks.find(t=>t.id==id);
const byTime=(a,b)=>a.done-b.done||(a.time||'99').localeCompare(b.time||'99');
const nf=()=>({id:null,title:'',pri:'media',w:'hoje',date:'',time:'',notes:'',err:''});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

const row=t=>{
 const sub=t.time?(t.pri==='alta'&&!t.done?'Até ':'')+t.time:'';
 const sel=panel&&panel.k==='detail'&&panel.id==t.id;
 return `<div class="card item${sel?' sel':''}" role="button" tabindex="0" data-a="open" data-id="${t.id}">
 <button class="chk ${t.done?'on':''}" data-a="tog" data-id="${t.id}" aria-label="${t.done?'Reabrir':'Concluir'}: ${esc(t.title)}">${t.done?CK:''}</button>
 <div class="tx ${t.done?'dn':''}"><div class="tt">${esc(t.title)}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>
 <span class="tag ${t.pri}">${P[t.pri]}</span></div>`};
const newBtn=`<button class="btn p s dsk" data-a="new">${PL} Nova tarefa</button>`;
const newFoot=`<div class="foot mob"><button class="btn p" data-a="new">${PL} Nova tarefa</button></div>`;

const MENU=[['hoje','Hoje'],['todas','Todas'],['pend','Pendentes'],['conc','Concluídas']];
const active=()=>page==='hoje'?'hoje':filter;
const cnt=k=>k==='hoje'?tasks.filter(t=>t.date===T0&&!t.done).length:k==='todas'?tasks.length:tasks.filter(t=>k==='pend'?!t.done:t.done).length;
const sideH=()=>`<div class="brand">Minhas tarefas</div>`+MENU.map(m=>`<button class="nav${active()===m[0]?' on':''}" data-a="nav" data-v="${m[0]}" ${active()===m[0]?'aria-current="page"':''}>${m[1]}<i>${cnt(m[0])}</i></button>`).join('')+`<div style="margin-top:auto;display:flex;flex-direction:column">${`<button class="btn p s" data-a="new">${PL} Nova tarefa</button>`}</div>`;
const tabsH=()=>MENU.map(m=>`<button class="${active()===m[0]?'on':''}" data-a="nav" data-v="${m[0]}">${m[1]}</button>`).join('');

function vHome(){
 const list=tasks.filter(t=>t.date===T0).sort(byTime);
 const d=list.filter(t=>t.done).length,pc=list.length?Math.round(d/list.length*100):0;
 const late=tasks.filter(t=>!t.done&&t.date<T0).length;
 return `<div class="wrap"><div class="head"><div><p class="sm">${DIA[now.getDay()]}, ${now.getDate()} de ${MES[now.getMonth()]}</p><h1>Hoje</h1></div>${newBtn}</div>
 ${late?`<button class="late" data-a="late">${late} ${late>1?'tarefas atrasadas':'tarefa atrasada'} – toque para ver</button>`:''}
 ${list.length?`<div class="card prog"><div>${d} de ${list.length} concluídas<span>${pc}%</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>${list.map(row).join('')}`:`<div class="empty">Nada para hoje.<br>Adicione uma tarefa ou aproveite o dia livre.</div>`}
 ${newFoot}</div>`}

function vAll(){
 let l=tasks.filter(t=>filter==='todas'||(filter==='pend'?!t.done:t.done));
 l.sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b));
 let h='',g=null;
 l.forEach(t=>{const k=t.date<T0&&!t.done?'Atrasadas':t.date===T0?'Hoje':t.date===T1?'Amanhã':fmt(t.date);
  if(k!==g){h+=`<div class="grp">${k}</div>`;g=k} h+=row(t)});
 const seg=MENU.slice(1).map(s=>`<button class="${filter===s[0]?'on':''}" data-a="nav" data-v="${s[0]}">${s[1]}</button>`).join('');
 return `<div class="wrap"><div class="head"><h1>Todas as tarefas</h1>${newBtn}</div>
 <div class="seg">${seg}</div>${h||'<div class="empty">Nenhuma tarefa aqui.</div>'}${newFoot}</div>`}

function vDetail(){
 const t=find(panel.id);
 const w=(t.date===T0?'Hoje':t.date===T1?'Amanhã':fmt(t.date))+(t.time?', '+t.time:'');
 return `<div class="pin"><div class="top"><button class="ib" data-a="close" aria-label="Voltar">${BK}</button><h2>Detalhe</h2></div>
 <div><span class="st ${t.done?'cl':'pe'}">${t.done?'Concluída':'Pendente'}</span></div>
 <h1>${esc(t.title)}</h1>
 <div class="card kv"><div>Prioridade<b style="color:var(--${t.pri==='alta'?'hi':t.pri==='media'?'md':'lo'})">${P[t.pri]}</b></div><div>Quando<b>${w}</b></div><div>Criada em<b>${fmt(t.created)}</b></div></div>
 ${t.notes?`<p class="obs">Observações</p><p class="obsx">${esc(t.notes)}</p>`:''}
 <div class="foot"><button class="btn p" data-a="tog2" data-id="${t.id}">${t.done?'Reabrir tarefa':CK+' Marcar como feita'}</button>
 <button class="btn" data-a="edit" data-id="${t.id}">Editar</button>
 <button class="btn d" data-a="del" data-id="${t.id}">${delArm?'Toque de novo para excluir':'Excluir tarefa'}</button></div></div>`}

function vForm(){
 const f=panel.f,c=on=>on?' on':'';
 return `<div class="pin"><div class="top"><button class="ib" data-a="cancel" aria-label="Voltar">${BK}</button><h2>${f.id?'Editar tarefa':'Nova tarefa'}</h2></div>
 <label class="l" for="f-t">O que você precisa fazer?</label>
 <input class="in" id="f-t" data-f="title" maxlength="80" placeholder="Ex.: Estudar para a prova" value="${esc(f.title)}" autocomplete="off">
 ${f.err==='t'?'<p class="err">Escreva o que você precisa fazer.</p>':''}
 <label class="l">Prioridade</label>
 <div>${['alta','media','baixa'].map(p=>`<button class="chip${c(f.pri===p)}" data-a="pri" data-v="${p}">${P[p]}</button>`).join('')}</div>
 <label class="l">Quando</label>
 <div>${[['hoje','Hoje'],['amanha','Amanhã'],['data','Escolher data']].map(w=>`<button class="chip${c(f.w===w[0])}" data-a="wh" data-v="${w[0]}">${w[1]}</button>`).join('')}</div>
 ${f.w==='data'?`<input class="in" type="date" min="${T0}" data-f="date" value="${f.date}" aria-label="Data">${f.err==='d'?'<p class="err">Escolha uma data.</p>':''}`:''}
 <label class="l" for="f-h">Horário (opcional)</label>
 <input class="in" id="f-h" type="time" data-f="time" value="${f.time}">
 <label class="l" for="f-n">Observações (opcional)</label>
 <textarea class="in" id="f-n" data-f="notes" maxlength="200" placeholder="Ex.: Enviar o PDF pelo portal">${esc(f.notes)}</textarea>
 <div class="foot"><button class="btn p" data-a="save">Salvar tarefa</button><button class="btn t" data-a="cancel">Cancelar</button></div></div>`}

function render(){
 if(panel&&panel.k==='detail'&&!find(panel.id))panel=null;
 $('#side').innerHTML=sideH();$('#tabs').innerHTML=tabsH();
 $('#main').innerHTML=page==='hoje'?vHome():vAll();
 const p=$('#panel');p.classList.toggle('open',!!panel);
 p.toggleAttribute('inert',!panel&&!wide());
 p.innerHTML=panel?(panel.k==='form'?vForm():vDetail()):'<div class="empty">Selecione uma tarefa para ver o detalhe<br>ou crie uma nova.</div>'}
function toggle(id){const t=find(id);t.done=!t.done;save();toast(t.done?'Tarefa concluída 🎉':'Tarefa reaberta')}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]'); if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
 if(a==='nav'){page=v==='hoje'?'hoje':'todas';if(v!=='hoje')filter=v;if(!wide())panel=null}
 else if(a==='late'){page='todas';filter='pend'}
 else if(a==='tog')toggle(id)
 else if(a==='tog2')toggle(id)
 else if(a==='open'){panel={k:'detail',id:+id};delArm=false}
 else if(a==='close')panel=null
 else if(a==='new')panel={k:'form',f:nf()}
 else if(a==='edit'){const t=find(id);panel={k:'form',f:{id:t.id,title:t.title,pri:t.pri,w:t.date===T0?'hoje':t.date===T1?'amanha':'data',date:t.date,time:t.time,notes:t.notes,err:''}}}
 else if(a==='cancel')panel=panel.f.id?{k:'detail',id:panel.f.id}:null
 else if(a==='pri')panel.f.pri=v
 else if(a==='wh')panel.f.w=v
 else if(a==='del'){if(!delArm)delArm=true;else{tasks=tasks.filter(t=>t.id!=id);save();toast('Tarefa excluída');panel=null;delArm=false}}
 else if(a==='save'){
  const f=panel.f,title=f.title.trim();
  if(!title)f.err='t';
  else if(f.w==='data'&&!f.date)f.err='d';
  else{
   const date=f.w==='hoje'?T0:f.w==='amanha'?T1:f.date;
   if(f.id){Object.assign(find(f.id),{title,pri:f.pri,date,time:f.time,notes:f.notes.trim()});panel={k:'detail',id:f.id};toast('Tarefa atualizada')}
   else{const t={id:Date.now(),title,pri:f.pri,date,time:f.time,done:false,notes:f.notes.trim(),created:T0};tasks.push(t);panel=wide()?{k:'detail',id:t.id}:null;toast('Tarefa salva')}
   if(date!==T0&&page==='hoje'){page='todas';filter='todas'}
   save()}}
 render()});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k&&panel&&panel.f)panel.f[k]=e.target.value});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches('.item'))e.target.click();
 if(e.key==='Escape'&&panel){panel=null;render()}});
matchMedia('(min-width:1200px)').addEventListener('change',render);
render();
</script>
</body>
